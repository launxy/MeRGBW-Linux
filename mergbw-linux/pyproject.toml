[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mergbw-linux"
version = "1.0.0"
description = "Control MeRGBW (BLE LED) desde Linux — reescritura de MeRGBW 1.6.3 Android"
requires-python = ">=3.10"
dependencies = ["bleak>=0.21", "PySide6>=6.6"]

[project.scripts]
mergbw = "mergbw.cli:main"
mergbw-gui = "mergbw.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mergbw*"]
